name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore ./DNP-BackOffice3.sln

    - name: Build solution
      run: dotnet build ./DNP-BackOffice3.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test ./DNP-BackOffice3.sln --no-build --configuration Release
